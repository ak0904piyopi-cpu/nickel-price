name: Update Nickel Price

on:
  schedule:
    - cron: "0 23 * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: python update_nickel_price.py

      - name: Commit nickel_history.csv
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add nickel_history.csv
          git diff --cached --quiet || git commit -m "Update nickel_history.csv"
          git push
